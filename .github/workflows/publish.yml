name: Release (npm)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build every native target and pack for publishing
    runs-on: adorsys-gis-runner   # self-hosted runner
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-gnu,
            x86_64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install zig (cross-compile toolchain for non-host targets)
        uses: mlugg/setup-zig@v2
        with:
          # cargo-zigbuild's Apple-target linker-argument handling for zig 0.16+ mismatches the
          # split `-Wl,-exported_symbols_list`/`-Wl,<path>` pair current rustc emits; the last
          # release before that behavior change builds every target cleanly.
          version: 0.15.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every declared native target
        working-directory: packages/engine
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            pnpm exec napi build --platform --release --target "$target" --cross-compile
          done

      - name: Verify the native binding actually loads
        working-directory: packages/server
        run: pnpm smoke:native

      - name: Scaffold and populate per-platform npm packages
        working-directory: packages/engine
        # --skip-optional-publish: the publish job downloads these packages and publishes them
        # itself — this step only prepares files, it never publishes.
        # --no-gh-release: binaries reach users as npm optionalDependencies, not GitHub release
        # assets, so no release needs creating here.
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir .
          pnpm exec napi pre-publish --skip-optional-publish --no-gh-release

      - name: Build the MCP server bundle
        working-directory: packages/server
        run: pnpm build

      - name: Pack every package into publishable tarballs
        # Grouped by publish order (platform packages, then the native package that optionally
        # depends on them, then the server package that depends on that) rather than left to
        # filesystem/glob ordering, which the packages' own overlapping name prefixes would get
        # wrong. `pnpm pack` (not `npm pack`) for the two workspace packages is load-bearing: it
        # resolves their `workspace:*` dependency to a real version the way `npm publish` alone
        # cannot, since plain `npm` has no notion of that protocol.
        run: |
          set -euo pipefail
          mkdir -p dist-packages/platforms dist-packages/native dist-packages/server
          for dir in packages/engine/npm/*/; do
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist-packages/platforms")
          done
          pnpm --filter @vymalo/lightbridge-code-intelligence-native pack --pack-destination dist-packages/native
          pnpm --filter @vymalo/lightbridge-code-intelligence-mcp pack --pack-destination dist-packages/server

      - name: Upload packed tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist-packages/
          retention-days: 1

  publish:
    name: Publish to npm (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest   # npm's OIDC trusted publishing does not support self-hosted runners
    permissions:
      id-token: write   # required for npm's OIDC token exchange
      contents: read
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Download packed tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist-packages

      - name: Publish platform packages
        run: |
          set -euo pipefail
          for tarball in dist-packages/platforms/*.tgz; do
            npm publish "$tarball" --access public
          done

      - name: Publish the native package
        run: npm publish dist-packages/native/*.tgz --access public

      - name: Publish the MCP server package
        run: npm publish dist-packages/server/*.tgz --access public
