name: Release (npm)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build every native target and pack for publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-gnu

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install zig (cross-compile toolchain for non-host targets)
        uses: mlugg/setup-zig@v2
        with:
          # cargo-zigbuild's Apple-target linker-argument handling for zig 0.16+ mismatches the
          # split `-Wl,-exported_symbols_list`/`-Wl,<path>` pair current rustc emits; the last
          # release before that behavior change builds every target cleanly.
          version: 0.15.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every declared native target
        working-directory: packages/engine
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            pnpm exec napi build --platform --release --target "$target" --cross-compile
          done

      - name: Verify the native binding actually loads
        working-directory: packages/server
        run: pnpm smoke:native

      - name: Build the MCP server bundle
        working-directory: packages/server
        run: pnpm build

      - name: Pack both packages into publishable tarballs
        # The native package carries every target's binary directly: the build loop above writes
        # each `.node` into `packages/engine/`, and that package's `files` glob picks them all up,
        # so the generated loader in `index.js` finds the host platform's binary inside the package
        # it was installed from. `pnpm pack` (not `npm pack`) is load-bearing — it resolves the
        # server package's `workspace:*` dependency on the native package to a real version, which
        # plain `npm` has no notion of.
        run: |
          set -euo pipefail
          mkdir -p dist-packages/native dist-packages/server
          pnpm --filter @vymalo/lightbridge-code-intelligence-native pack --pack-destination dist-packages/native
          pnpm --filter @vymalo/lightbridge-code-intelligence-mcp pack --pack-destination dist-packages/server

      - name: Upload packed tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist-packages/
          retention-days: 1

  publish:
    name: Publish to npm (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for npm's OIDC token exchange
      contents: read
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Download packed tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist-packages

      - name: Publish the native package
        run: npm publish dist-packages/native/*.tgz --access public

      - name: Publish the MCP server package
        run: npm publish dist-packages/server/*.tgz --access public
