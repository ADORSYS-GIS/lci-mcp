name: Release (npm)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build every native target and publish
    runs-on: adorsys-gis-runner   # self-hosted runner
    permissions:
      contents: write   # napi pre-publish creates a GitHub release and uploads binaries as assets
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-gnu,
            x86_64-apple-darwin,
            aarch64-apple-darwin,
            x86_64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install zig (cross-compile toolchain for non-host targets)
        uses: mlugg/setup-zig@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Linux targets against a portable glibc baseline
        working-directory: packages/engine
        # napi-rs's own prebuilt cross toolchain (glibc 2.17) makes the Linux binaries installable on
        # any distribution from the last decade or so, not just whatever glibc the build host has —
        # the toolchain ships no zlib of its own, and its aarch64 compiler needs two C-standard flags
        # it doesn't set by default.
        env:
          LIBZ_SYS_STATIC: "1"
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8 -std=gnu99"
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            pnpm exec napi build --platform --release --target "$target" --use-napi-cross
          done

      - name: Verify the Linux builds stayed within the glibc baseline
        working-directory: packages/engine
        run: |
          set -euo pipefail
          baseline="2.17"
          for f in lci-mcp-engine.linux-x64-gnu.node lci-mcp-engine.linux-arm64-gnu.node; do
            highest=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "$f requires up to GLIBC_$highest"
            if [ "$(printf '%s\n%s\n' "$baseline" "$highest" | sort -V | tail -1)" != "$baseline" ]; then
              echo "::error::$f requires GLIBC_$highest, newer than the $baseline baseline"
              exit 1
            fi
          done

      - name: Build the remaining declared native targets
        working-directory: packages/engine
        run: |
          set -euo pipefail
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            pnpm exec napi build --platform --release --target "$target" --cross-compile
          done

      - name: Scaffold and populate per-platform npm packages
        working-directory: packages/engine
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir .
          pnpm exec napi pre-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the native binding actually loads
        working-directory: packages/server
        run: pnpm smoke:native

      - name: Build the MCP server bundle
        working-directory: packages/server
        run: pnpm build

      - name: Publish every package
        run: pnpm publish -r --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
